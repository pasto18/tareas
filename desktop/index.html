<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Nueva tarea</title>
<style>
  :root { --bg:#f3f2f2; --surface:#eae9e9; --ink:#201e1d; --accent:#ec3013; --a700:#ae1800; --n700:#605d5d; --divider: color-mix(in srgb, #201e1d 40%, transparent); }
  * { box-sizing: border-box; }
  html, body { margin:0; overflow-y:auto; background:var(--bg); color:var(--ink); font:14px/1.4 -apple-system, "Archivo", system-ui, sans-serif; -webkit-user-select:none; }
  body { padding:14px; min-height:100vh; display:flex; flex-direction:column; gap:12px; -webkit-app-region: drag; }
  body > * { -webkit-app-region: no-drag; }
  .head { display:flex; align-items:center; justify-content:space-between; -webkit-app-region: drag; }
  .head b { font-size:20px; font-weight:800; letter-spacing:-0.02em; }
  .link { font-size:12px; color:var(--n700); background:none; border:0; cursor:pointer; text-decoration:underline; padding:0; -webkit-app-region:no-drag; }
  textarea, input, button { font:inherit; color:inherit; }
  textarea { width:100%; height:78px; resize:none; border:1px solid var(--divider); background:var(--surface); padding:10px; font-weight:600; font-size:15px; -webkit-user-select:text; }
  textarea:focus, input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .lbl { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--n700); margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { height:32px; padding:0 12px; border:1px solid var(--divider); background:none; cursor:pointer; font-size:13px; font-weight:600; }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip.dash { border-style:dashed; color:var(--n700); }
  input.mini { width:100%; height:34px; margin-top:8px; border:1px solid var(--divider); background:var(--surface); padding:0 10px; -webkit-user-select:text; }
  textarea.shop { height:56px; font-size:13px; font-weight:400; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  input[type=date], input[type=time] { height:36px; border:1px solid var(--divider); background:var(--surface); padding:0 8px; width:100%; }
  .prio { align-self:flex-start; }
  .prio.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .go { margin-top:auto; height:46px; border:0; background:var(--accent); color:var(--bg); font-weight:800; font-size:15px; cursor:pointer; }
  .go:active { background:var(--a700); }
  .go:disabled { opacity:.6; }
  .msg { min-height:18px; font-size:12px; color:var(--a700); }
  .msg.ok { color:var(--n700); }
</style>
</head>
<body>
  <div class="head"><b>Nueva tarea</b><button class="link" id="web">Abrir lista</button></div>
  <textarea id="text" placeholder="¿Qué hay que hacer?" autofocus></textarea>
  <div><div class="lbl">Proyecto</div><div class="chips" id="projects"></div><input type="text" id="newProject" class="mini" placeholder="Nombre del proyecto nuevo" style="display:none"></div>
  <div><div class="lbl">Rubro</div><div class="chips" id="rubros"></div><input type="text" id="newRubro" class="mini" placeholder="Nombre del rubro nuevo" style="display:none"></div>
  <!-- "Asignada a" oculto por ahora: quitar style="display:none" para volver a mostrarlo -->
  <div style="display:none"><div class="lbl">Asignada a</div><div class="chips" id="people"></div><input type="text" id="newPerson" class="mini" placeholder="Nombre de la persona nueva" style="display:none"></div>
  <div><div class="lbl">Compras (una por línea)</div><textarea id="shop" class="shop" placeholder="Ej: tornillos&#10;cinta métrica"></textarea></div>
  <div><div class="lbl">Fecha (Calendar)</div><div class="row"><input type="date" id="date"><input type="time" id="time"></div></div>
  <button class="chip prio" id="prio" type="button">Prioridad alta</button>
  <div class="msg" id="msg"></div>
  <button class="go" id="go">Añadir tarea</button>
<script src="renderer.js"></script>
</body>
</html>
